<style>
  :root{
    --bg:#080A0F; --bg-alt:#0B0E15; --panel:#12161F; --line:#212736; --line-soft:#1A1F2C;
    --text:#EDF0F5; --text-soft:#8B96AC; --text-dim:#565F76;
    --wa-green:#2BE080; --tick-blue:#3FC1FF; --violet:#9C8CFF;
    --glow-green:rgba(43,224,128,0.32); --glow-blue:rgba(63,193,255,0.24);
    --red:#FF6B6B;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  body.lang-ur{ font-family:'Noto Nastaliq Urdu',serif; }
  a{color:inherit;}
  .wrap{ max-width:980px; margin:0 auto; padding:0 24px; }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0; }
  body.lang-ur h1, body.lang-ur h2, body.lang-ur h3{ font-family:'Noto Nastaliq Urdu',serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  nav{ position:sticky; top:0; z-index:20; background:rgba(8,10,15,0.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line-soft); }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .wordmark{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; text-decoration:none; display:flex; align-items:center; gap:8px; }
  .tier-badge{ font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.04em; text-transform:uppercase; padding:5px 12px; border-radius:20px; }
  .tier-badge.premium{ background:rgba(43,224,128,0.12); color:var(--wa-green); border:1px solid rgba(43,224,128,0.3); }
  .tier-badge.free{ background:rgba(255,255,255,0.06); color:var(--text-soft); border:1px solid var(--line); }

  main{ padding:32px 0 60px; }
  .top-row{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:20px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .card h2{ font-size:0.95rem; color:var(--text-soft); font-weight:500; margin-bottom:14px; text-transform:none; }

  .balance-figures{ display:flex; gap:28px; flex-wrap:wrap; }
  .balance-figures div span{ display:block; }
  .fig-label{ font-size:0.78rem; color:var(--text-dim); margin-bottom:4px; }
  .fig-value{ font-family:'Space Grotesk',sans-serif; font-size:1.7rem; font-weight:700; }
  .fig-value.income{ color:var(--wa-green); }
  .fig-value.expense{ color:var(--red); }
  .fig-value.net{ background:linear-gradient(90deg,var(--wa-green),var(--tick-blue)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .upsell{ background:linear-gradient(135deg, rgba(43,224,128,0.08), rgba(63,193,255,0.06)); border:1px solid rgba(43,224,128,0.25); border-radius:16px; padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .upsell p{ margin:0; font-size:0.85rem; color:var(--text-soft); }
  .upsell .btn{ background:var(--wa-green); color:#04140A; font-weight:600; font-size:0.82rem; padding:9px 16px; border-radius:9px; text-decoration:none; white-space:nowrap; }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:0.85rem; }
  .bar-label{ width:110px; flex-shrink:0; color:var(--text-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:8px; background:var(--line-soft); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--wa-green),var(--tick-blue)); border-radius:6px; }
  .bar-amt{ width:64px; text-align:right; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:0.76rem; color:var(--text-dim); }

  .progress-item{ margin-bottom:16px; }
  .progress-item:last-child{ margin-bottom:0; }
  .progress-top{ display:flex; justify-content:space-between; font-size:0.86rem; margin-bottom:6px; }
  .progress-top .name{ color:var(--text); font-weight:500; }
  .progress-top .nums{ font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--text-dim); }
  .progress-track{ height:7px; background:var(--line-soft); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:6px; }
  .progress-fill.ok{ background:var(--wa-green); }
  .progress-fill.warn{ background:#F5B04D; }
  .progress-fill.over{ background:var(--red); }

  table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim); font-weight:500; padding:0 0 10px; }
  td{ padding:9px 0; border-top:1px solid var(--line-soft); color:var(--text-soft); }
  td.desc{ color:var(--text); }
  td.amt{ font-family:'JetBrains Mono',monospace; text-align:right; }
  td.amt.expense{ color:var(--red); }
  td.amt.income{ color:var(--wa-green); }
  body.lang-ur th, body.lang-ur td.desc{ text-align:right; }
  .cat-pill{ display:inline-block; background:var(--line-soft); color:var(--text-soft); font-size:0.72rem; padding:2px 9px; border-radius:20px; }

  .reminder-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line-soft); font-size:0.86rem; }
  .reminder-row:first-child{ border-top:none; }
  .reminder-title{ color:var(--text); }
  .reminder-meta{ font-family:'JetBrains Mono',monospace; font-size:0.74rem; color:var(--text-dim); }

  .empty{ color:var(--text-dim); font-size:0.85rem; padding:8px 0; }
  .state-msg{ text-align:center; padding:80px 20px; color:var(--text-soft); }
  .state-msg h2{ color:var(--text); font-size:1.3rem; margin-bottom:8px; }

  @media (max-width: 760px){
    .top-row, .grid-2{ grid-template-columns:1fr; }
    .upsell{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>

    no_budgets: 'ہالے کوئی بجٹ سیٹ نئیں۔',
    no_goals: 'ہالے کوئی سیونگز گول نئیں۔',
    no_reminders: 'کوئی ایکٹو ریمائنڈر نئیں۔',
    no_transactions: 'ہالے کوئی ٹرانزیکشن نئیں۔',
    upsell_text: 'فری پلان صرف پچھلے 3 مہینے دکھاندا اے۔ مکمل ہسٹری، ان لمیٹڈ بجٹس تے ریمائنڈرز، تے ایکسپورٹس لئی پریمیم لاؤ۔',
    upgrade_btn: 'پریمیم لاؤ — 299 روپے ماہانہ',
    balance: 'بیلنس', income: 'آمدن', expenses: 'خرچ', net: 'خالص',
    spending_by_category: 'کیٹیگری دے حساب نال خرچ',
    budgets: 'بجٹس', savings_goals: 'سیونگز گولز', active_reminders: 'ایکٹو ریمائنڈرز',
    recent_transactions: 'حالیہ ٹرانزیکشنز',
    date: 'تاریخ', description: 'تفصیل', category: 'کیٹیگری', amount: 'امونٹ',
    since: 'توں', all_time: 'پورا ریکارڈ',
    today: 'اج', this_week: 'اس ہفتے',
    back_to_whatsapp: '\u2190 واٹس ایپ تے واپس',
    months: ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر']
  }

};

let currentLang = 'en';
function t(key){ return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key] || key; }

function fmt(n){ return Number(n||0).toLocaleString('en-US', {maximumFractionDigits:0}); }

function monthYearLabel(dateStr){
  const d = new Date(dateStr);
  const months = TRANSLATIONS[currentLang].months;
  return `${months[d.getMonth()]} ${d.getFullYear()}`;
}

function periodLabel(period, todayIso){
  if(period === 'daily') return t('today');
  if(period === 'weekly') return t('this_week');
  return monthYearLabel(todayIso);
}

function rangeLabel(data){
  if(data.tier === 'free' && data.cutoff_iso){
    const d = new Date(data.cutoff_iso);
    const months = TRANSLATIONS[currentLang].months;
    return `${t('since')} ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  }
  return t('all_time');
}

function renderError(msg){
  document.getElementById('content').innerHTML = `<div class="state-msg"><h2>${msg}</h2><p>${t('ask_fresh_link')}</p></div>`;
}

function budgetBarClass(spent, limit){
  if(!limit) return 'ok';
  const pct = spent/limit;
  if(pct >= 1) return 'over';
  if(pct >= 0.8) return 'warn';
  return 'ok';
}

function render(data){
  currentLang = data.lang || 'en';
  document.body.className = (currentLang === 'ur' || currentLang === 'pa') ? 'lang-ur' : '';
  document.documentElement.setAttribute('dir', (currentLang === 'ur' || currentLang === 'pa') ? 'rtl' : 'ltr');
  document.getElementById('backLink').textContent = t('back_to_whatsapp');

  document.getElementById('loadingMsg')?.remove();
  const tierBadge = document.getElementById('tierBadge');
  tierBadge.textContent = data.tier === 'premium' ? t('premium') : t('free');
  tierBadge.className = 'tier-badge ' + data.tier;

  const catTotals = {};
  data.transactions.filter(t=>t.type==='expense').forEach(t=>{
    catTotals[t.category] = (catTotals[t.category]||0) + (t.amount||0);
  });
  const catSorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCat = catSorted.length ? catSorted[0][1] : 1;

  const chartHtml = catSorted.length ? catSorted.map(([cat,amt])=>`
    <div class="bar-row">
      <div class="bar-label">${cat}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%"></div></div>
      <div class="bar-amt">${fmt(amt)}</div>
    </div>`).join('') : `<div class="empty">${t('no_spending')}</div>`;

  const budgetGroups = {};
  data.budgets.forEach(b => {
    const key = periodLabel(b.period, data.today_iso);
    if(!budgetGroups[key]) budgetGroups[key] = [];
    budgetGroups[key].push(b);
  });
  const budgetHtml = data.budgets.length ? Object.entries(budgetGroups).map(([label, group]) => {
    const rows = group.map(b=>{
      const spentForCat = b.spent || 0;
      const cls = budgetBarClass(spentForCat, b.amount);
      const pct = Math.min(100, (spentForCat/b.amount*100)||0);
      return `<div class="progress-item">
        <div class="progress-top"><span class="name">${b.category}</span><span class="nums">${fmt(spentForCat)} / ${fmt(b.amount)} PKR</span></div>
        <div class="progress-track"><div class="progress-fill ${cls}" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    return `<div style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;">${label}</div>${rows}`;
  }).join('<div style="height:16px"></div>') : `<div class="empty">${t('no_budgets')}</div>`;

  const goalHtml = data.goals.length ? data.goals.map(g=>{
    const pct = Math.min(100, (g.saved_amount/g.target_amount*100)||0);
    return `<div class="progress-item">
      <div class="progress-top"><span class="name">${g.goal_name}</span><span class="nums">${fmt(g.saved_amount)} / ${fmt(g.target_amount)} PKR</span></div>
      <div class="progress-track"><div class="progress-fill ok" style="width:${pct}%"></div></div>
    </div>`;
  }).join('') : `<div class="empty">${t('no_goals')}</div>`;

  const reminderHtml = data.reminders.length ? data.reminders.map(r=>`
    <div class="reminder-row">
      <span class="reminder-title">${r.title}</span>
      <span class="reminder-meta">${r.due_date || '\u2014'}${r.recurrence && r.recurrence!=='none' ? ' \u00b7 '+r.recurrence : ''}</span>
    </div>`).join('') : `<div class="empty">${t('no_reminders')}</div>`;

  let txLastMonth = '';
  const txHtml = data.transactions.length ? data.transactions.slice(0,15).map(t=>{
    const monthLabel = monthYearLabel(t.date);
    let header = '';
    if(monthLabel !== txLastMonth){
      header = `<tr><td colspan="4" style="padding-top:14px;padding-bottom:6px;font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);border-top:none;">${monthLabel}</td></tr>`;
      txLastMonth = monthLabel;
    }
    return `${header}<tr>
      <td>${t.date}</td>
      <td class="desc">${t.description || t.category}</td>
      <td><span class="cat-pill">${t.category}</span></td>
      <td class="amt ${t.type}">${t.type==='expense'?'&minus;':'+'}${fmt(t.amount)}</td>
    </tr>`;
  }).join('') : '';

  const upsell = data.tier === 'free' ? `
    <div class="upsell">
      <p>${t('upsell_text')}</p>
      <a class="btn" href="#">${t('upgrade_btn')}</a>
    </div>` : '';

  document.getElementById('content').innerHTML = `
    ${upsell}
    <div class="top-row" style="margin-top:${data.tier==='free'?'20px':'0'}">
      <div class="card">
        <h2>${t('balance')} <span style="font-weight:400;color:var(--text-dim);font-size:0.78em;">&middot; ${rangeLabel(data)}</span></h2>
        <div class="balance-figures">
          <div><span class="fig-label">${t('income')}</span><span class="fig-value income">${fmt(data.balance.income)}</span></div>
          <div><span class="fig-label">${t('expenses')}</span><span class="fig-value expense">${fmt(data.balance.expense)}</span></div>
          <div><span class="fig-label">${t('net')}</span><span class="fig-value net">${fmt(data.balance.net)}</span></div>
        </div>
      </div>
      <div class="card">
        <h2>${t('spending_by_category')}</h2>
        ${chartHtml}
      </div>
    </div>
    <div class="grid-2">
      <div class="card"><h2>${t('budgets')}</h2>${budgetHtml}</div>
      <div class="card"><h2>${t('savings_goals')}</h2>${goalHtml}</div>
    </div>
    <div class="grid-2">
      <div class="card"><h2>${t('active_reminders')}</h2>${reminderHtml}</div>
      <div class="card">
        <h2>${t('recent_transactions')}</h2>
        ${txHtml ? `<table><thead><tr><th>${t('date')}</th><th>${t('description')}</th><th>${t('category')}</th><th style="text-align:right">${t('amount')}</th></tr></thead><tbody>${txHtml}</tbody></table>` : `<div class="empty">${t('no_transactions')}</div>`}
      </div>
    </div>
  `;
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if(!token){ renderError(t('no_link')); return; }

  window.history.replaceState({}, '', window.location.pathname);

  try{
    const dataRes = await fetch(`${API_BASE}/api/dashboard/data?token=${encodeURIComponent(token)}`);
    if(!dataRes.ok){ renderError(t('link_expired')); return; }
    const data = await dataRes.json();
    render(data);
  } catch(e){ renderError(t('server_error')); }
}

init();
</script>

</body>
</html>
